# CDT-switcher 配置示例。复制为 config.yaml，并替换 YOUR_* 和文档示例地址。
# 控制台及 RAM 授权：docs/permissions.md；部署流程：docs/deploy.md。
# config.yaml 包含访问凭据，应仅允许服务用户和管理员读取。

# 每个账号键对应一组账户凭据和一台 ECS；账号键用于命令及本地历史记录。
accounts:
  A:
    region: cn-hongkong
    access_key_id: "YOUR_ACCOUNT_A_ACCESS_KEY_ID"
    access_key_secret: "YOUR_ACCOUNT_A_ACCESS_KEY_SECRET"
    instance_id: "YOUR_ACCOUNT_A_INSTANCE_ID"
    instance_name: "节点 A"        # 可选显示名；通知中显示为“节点 A [A]”
    eip: "203.0.113.10"            # 实例预期公网地址，支持 EIP 或实例公网 IP
    service_port: 31227            # 控制机连接的公网 TCP 业务端口
    # 未设置 instance_name 时使用观测到的 ECS InstanceName，未取得名称时使用账号键。
    # ecs_endpoint: ""             # 可选接入点，默认 ecs.<region>.aliyuncs.com
    # cdt_endpoint: "cdt.aliyuncs.com"
  B:
    region: cn-hongkong
    access_key_id: "YOUR_ACCOUNT_B_ACCESS_KEY_ID"
    access_key_secret: "YOUR_ACCOUNT_B_ACCESS_KEY_SECRET"
    instance_id: "YOUR_ACCOUNT_B_INSTANCE_ID"
    instance_name: "节点 B"
    eip: "203.0.113.11"
    service_port: 31227

telegram:
  bot_token: "YOUR_TELEGRAM_BOT_TOKEN"
  chat_ids: [123456789]            # 数字聊天 ID 列表；群组 ID 可为负数
  # 授权范围为整个聊天。授权群组中可发送命令的成员均可触发控制操作。
  # 运行报告和通知发送到全部授权聊天。

# 可选账单查询，复用账户凭据；需额外授权 bss:DescribeBillList。
# 配置和金额口径：docs/billing.md。
billing:
  enabled: false                  # YAML 布尔值；默认关闭，修改后重启主程序
  # 开启后注册 /bill、/bill 账号键，并在每日 23:58（UTC+8）报告中增加本月费用。
  # 手动查询复用窗口固定为 300 秒，缓存仅保留当月内存汇总。

# 以下字段均可省略。注明 ENV 的字段支持对应环境变量覆盖，环境变量优先。
thresholds:
  # 调度与流量
  patrol_interval_sec: 60          # 常规巡检及记账周期；ENV: PATROL_INTERVAL
  traffic_interval_min: 20         # CDT 刷新周期；ENV: TRAFFIC_INTERVAL
  traffic_threshold_gb: 188        # 非内地流量阈值；ENV: TRAFFIC_THRESHOLD_GB
  # 流量数值按字节 / 1024^3 换算；根据实际账户额度、计量单位和查询延迟设置余量。
  tmax_hours: 360                  # 每账户本月运行时长阈值；ENV: TMAX_HOURS

  # 启动、服务探测与停机
  start_timeout_sec: 600           # 目标启动等待超时；ENV: START_TIMEOUT
  nostock_backoff_sec: [60, 120, 240, 480]  # 库存不足退避序列，后续使用末项
  probe_interval_sec: 5            # 服务探测间隔及快速控制周期；ENV: PROBE_INTERVAL
  probe_required_success: 3        # 进入停机阶段所需连续探测成功数；ENV: PROBE_REQUIRED_SUCCESS
  probe_timeout_sec: 240           # 服务检查超时；ENV: PROBE_TIMEOUT
  stop_timeout_sec: 600            # 停机确认超时告警阈值；ENV: STOP_TIMEOUT
  stop_retry_interval_sec: 300     # 停机请求重试间隔；ENV: STOP_RETRY_INTERVAL
  stop_alarm_interval_sec: 1800    # 停机异常重复告警间隔；ENV: STOP_ALARM_INTERVAL
  alert_repeat_interval_sec: 1800  # 同类告警最短重复间隔；ENV: ALERT_REPEAT_INTERVAL

  # 数据有效期与历史清理
  traffic_stale_sec: 3600          # 候选选择接受的快照最大年龄；ENV: TRAFFIC_STALE
  traffic_retention_days: 180      # 流量记录保留天数；ENV: TRAFFIC_RETENTION_DAYS
  event_retention_days: 180        # 事件记录保留天数；ENV: EVENT_RETENTION_DAYS
  runtime_retention_months: 24     # 历史运行月份清理窗口；ENV: RUNTIME_RETENTION_MONTHS

  # 可选控制入口
  auto_switch_on_service_down: false   # 服务连续探测失败时自动切换；ENV: AUTO_SWITCH_ON_SERVICE_DOWN
  enable_eventbridge_webhook: false    # 实验性回收事件入口；ENV: ENABLE_EVENTBRIDGE_WEBHOOK
  webhook_listen: "127.0.0.1:8787"      # 启用时由部署者配置来源认证和受限访问

  # 相对路径以进程工作目录为基准；systemd 默认目录为 /opt/cdt-switcher。
  db_path: "rotator.db"            # SQLite 数据库；ENV: DB_PATH
  state_path: "state.json"         # 切换进度和保护意图；ENV: STATE_PATH
